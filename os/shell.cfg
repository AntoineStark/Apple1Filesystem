MEMORY {
    LOW: start = $0000, size = $2000, file = %O, fill = yes, fillval = $FF;
    ROM: start = $2000, size = $4000, file = %O, fill = yes, fillval = $FF;
    HIGH: start = $6000, size = $1FFA, file = %O, fill = yes, fillval = $FF;
    VECTORS: start = $FFFA, size = $0006, file = %O;
}
SEGMENTS {
    CODE: load = ROM, type = ro;
    RODATA: load = ROM, type = ro;
    VECTORS: load = VECTORS, type = ro;
}